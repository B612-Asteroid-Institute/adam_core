[package]
name = "adam_core"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Public Rust API for adam-core asteroid and orbital-mechanics workflows"
keywords = ["astronomy", "asteroids", "orbits", "spice"]
categories = ["science"]

[features]
default = []
python-bindings = []

[dependencies]
adam_core_rs_autodiff = { version = "=0.7.0", path = "../adam_core_rs_autodiff" }
adam_core_rs_coords = { version = "=0.7.0", path = "../adam_core_rs_coords" }
adam_core_rs_kernel_data = { version = "=0.7.0", path = "../adam_core_rs_kernel_data" }
adam_core_rs_orbit_determination = { version = "=0.7.0", path = "../adam_core_rs_orbit_determination" }
adam_core_rs_spice = { version = "=0.7.0", path = "../adam_core_rs_spice" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[build-dependencies]
serde_json = "1"

[[test]]
name = "build_identity"
path = "build_identity.rs"
