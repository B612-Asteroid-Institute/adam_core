name: Release candidate wheel matrix

on:
  workflow_dispatch:
    inputs:
      adam_assist_ref:
        description: Exact compatible adam-assist revision to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-wheel-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  ADAM_ASSIST_REF: ${{ inputs.adam_assist_ref }}
  PIP_ONLY_BINARY: ":all:"
  PYTHON_PREVIEW_VERSION: "0.7.0"
  ADAM_CORE_RELEASE_BUILD: "1"
  ADAM_CORE_BUILD_COMMIT: ${{ github.sha }}

jobs:
  artifact-acceptance:
    name: ${{ matrix.platform.name }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - name: manylinux-x86_64
            runner: ubuntu-latest
            system: Linux-x86_64
            family: manylinux
            target: x86_64-unknown-linux-gnu
            wheel_tag: manylinux*x86_64
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            system: Linux-aarch64
            family: manylinux
            target: aarch64-unknown-linux-gnu
            wheel_tag: manylinux*aarch64
          - name: macos-arm64
            runner: macos-15
            system: Darwin-arm64
            family: native
            wheel_tag: macosx*arm64
          - name: macos-x86_64
            runner: macos-15-intel
            system: Darwin-x86_64
            family: native
            wheel_tag: macosx*x86_64
    steps:
      - name: Checkout adam-core candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout adam-assist candidate
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v4
        with:
          repository: B612-Asteroid-Institute/adam-assist
          ref: ${{ env.ADAM_ASSIST_REF }}
          path: adam-assist
          fetch-depth: 0

      - name: Verify exact ASSIST revision
        if: matrix.python-version != '3.14'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ADAM_ASSIST_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C adam-assist rev-parse HEAD)" = "$ADAM_ASSIST_REF"

      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy

      - name: Prepare compatible ASSIST lock for Core candidate
        if: matrix.python-version != '3.14'
        env:
          ADAM_ASSIST_RUST_REPO: ${{ github.workspace }}/adam-assist
        run: python migration/scripts/develop_downstream_adam_assist.py --prepare-only

      - name: Verify runner architecture
        shell: bash
        run: |
          python - <<'PY'
          import platform
          expected = "${{ matrix.platform.system }}"
          actual = f"{platform.system()}-{platform.machine()}"
          if actual != expected:
              raise SystemExit(f"runner architecture mismatch: {actual} != {expected}")
          PY

      - name: Install audited adam-core wheel builder
        run: >-
          python -m pip install "maturin==1.15.0" "packaging==25.0"
          "ziglang==0.17.0"

      - name: Build adam-core manylinux wheel (attested wrapper)
        if: matrix.platform.family == 'manylinux'
        run: >-
          python migration/scripts/build_release_wheel.py --out wheelhouse --
          --zig --target ${{ matrix.platform.target }} --manylinux 2_17
          -i python${{ matrix.python-version }}

      - name: Build adam-assist manylinux wheel
        if: matrix.python-version != '3.14' && matrix.platform.family == 'manylinux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: "2_17"
          rust-toolchain: 1.87.0
          working-directory: adam-assist
          args: --release --locked -i python${{ matrix.python-version }} --out ../wheelhouse

      - name: Build adam-core native wheel (attested wrapper)
        if: matrix.platform.family == 'native'
        run: >-
          python migration/scripts/build_release_wheel.py --out wheelhouse --
          -i python${{ matrix.python-version }}

      - name: Build adam-assist native wheel
        if: matrix.python-version != '3.14' && matrix.platform.family == 'native'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          rust-toolchain: 1.87.0
          working-directory: adam-assist
          args: --release --locked -i python${{ matrix.python-version }} --out ../wheelhouse

      - name: Run exact clean-room acceptance with prebuilt source-pair wheels
        if: matrix.python-version != '3.14'
        shell: bash
        run: |
          set -euo pipefail
          python migration/scripts/run_clean_room_artifact_acceptance.py \
            --prebuilt-wheelhouse "$GITHUB_WORKSPACE/wheelhouse" \
            --adam-core-repo "$GITHUB_WORKSPACE" \
            --adam-core-ref HEAD \
            --adam-assist-repo "$GITHUB_WORKSPACE/adam-assist" \
            --adam-assist-ref HEAD \
            --workspace "$RUNNER_TEMP/acceptance" \
            --report "$RUNNER_TEMP/acceptance-report.json" \
            --python "$(command -v python)"

      - name: Run CPython 3.14 Core-only wheel acceptance
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/acceptance"
          runtime="$acceptance/core-runtime"
          mkdir -p "$acceptance/wheelhouse" "$acceptance/logs" "$acceptance/invocation"
          core_wheels=("$GITHUB_WORKSPACE"/wheelhouse/adam_core-*.whl)
          test "${#core_wheels[@]}" -eq 1
          cp "${core_wheels[0]}" "$acceptance/wheelhouse/"

          python -m venv "$runtime"
          runtime_python="$runtime/bin/python"
          "$runtime_python" -m pip install --upgrade pip \
            >"$acceptance/logs/upgrade_runtime_pip.log" 2>&1
          "$runtime_python" -m pip install "${core_wheels[0]}" \
            >"$acceptance/logs/install_adam_core_wheel.log" 2>&1
          "$runtime_python" -m pip check \
            >"$acceptance/logs/pip_check.log" 2>&1
          "$runtime_python" -m pip freeze --all \
            >"$acceptance/logs/pip_freeze.log" 2>&1

          export CORE_ACCEPTANCE_REPORT="$RUNNER_TEMP/acceptance-report.json"
          export CORE_SMOKE_REPORT="$acceptance/invocation/smoke-report.json"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 "$runtime_python" - <<'PY'
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path

          import numpy as np

          import adam_core
          from adam_core import _rust_native
          from adam_core.dynamics.lambert import calculate_c3
          from adam_core.time import Timestamp

          expected_version = os.environ["PYTHON_PREVIEW_VERSION"]
          distribution_version = importlib.metadata.version("adam-core")
          native_version, native_commit = _rust_native.build_identity()
          if platform.python_version_tuple()[:2] != ("3", "14"):
              raise AssertionError(f"expected CPython 3.14, got {platform.python_version()}")
          if not (
              distribution_version
              == adam_core.__version__
              == native_version
              == expected_version
          ):
              raise AssertionError("Core distribution, Python, and native versions differ")
          if native_commit != os.environ["GITHUB_SHA"]:
              raise AssertionError(f"native commit mismatch: {native_commit}")
          native_path = Path(_rust_native.__file__).resolve()
          if native_path.suffix not in {".so", ".dylib"}:
              raise AssertionError(f"not a native extension: {native_path}")
          if "site-packages" not in native_path.parts:
              raise AssertionError(f"native module is not installed in the venv: {native_path}")
          try:
              importlib.metadata.version("jax")
          except importlib.metadata.PackageNotFoundError:
              pass
          else:
              raise AssertionError("standard Core wheel acceptance installed optional JAX")

          times = Timestamp.from_iso8601(
              ["2022-01-01T00:00:00.000", "2022-06-01T12:34:56.789"],
              scale="utc",
          )
          iso_values = times.to_iso8601().to_pylist()
          if iso_values != ["2022-01-01T00:00:00.000", "2022-06-01T12:34:56.789"]:
              raise AssertionError(f"timestamp round trip changed: {iso_values}")
          c3 = calculate_c3(
              np.array([[1.0, 2.0, 3.0]]),
              np.array([[0.5, 1.0, 1.5]]),
          )
          np.testing.assert_allclose(c3, np.array([3.5]), rtol=0.0, atol=0.0)

          versions = {"adam-core": distribution_version}
          smoke = {
              "status": "passed",
              "stages": {
                  "imports_and_provenance": {
                      "versions": versions,
                      "runtime_versions": versions,
                      "native_path": str(native_path),
                      "build_identity": [native_version, native_commit],
                      "optional_jax_installed": False,
                  },
                  "native_numerical": {
                      "iso_values": iso_values,
                      "c3_au2_per_day2": c3.tolist(),
                  },
              },
          }
          report = {
              "status": "passed",
              "acceptance_mode": "core-only-cpython-3.14",
              "runtime": {"smoke": smoke},
          }
          Path(os.environ["CORE_ACCEPTANCE_REPORT"]).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          Path(os.environ["CORE_SMOKE_REPORT"]).write_text(
              json.dumps(smoke, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Inspect adam-core wheel contents
        shell: bash
        run: |
          set -euo pipefail
          inspection="$RUNNER_TEMP/core-wheel-inspection"
          rm -rf "$inspection"
          mkdir -p "$inspection"
          cp "$RUNNER_TEMP"/acceptance/wheelhouse/adam_core-*.whl "$inspection/"
          python migration/scripts/check_wheel_artifacts.py "$inspection"

      - name: Verify platform wheel count and tags
        shell: bash
        run: |
          python - <<'PY'
          import email
          import fnmatch
          import json
          import os
          import zipfile
          from pathlib import Path

          wheelhouse = Path(os.environ["RUNNER_TEMP"]) / "acceptance" / "wheelhouse"
          core = list(wheelhouse.glob("adam_core-*.whl"))
          assist = list(wheelhouse.glob("adam_assist-*.whl"))
          expect_assist = "${{ matrix.python-version }}" != "3.14"
          expected_assist_count = 1 if expect_assist else 0
          if len(core) != 1 or len(assist) != expected_assist_count:
              raise SystemExit(
                  "unexpected platform wheel count; "
                  f"{core=} {assist=} {expect_assist=}"
              )
          expected_version = os.environ["PYTHON_PREVIEW_VERSION"]
          with zipfile.ZipFile(core[0]) as archive:
              metadata_paths = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit(f"unexpected METADATA files: {metadata_paths}")
              metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
          if metadata["Name"] != "adam_core" or metadata["Version"] != expected_version:
              raise SystemExit(
                  f"adam-core release metadata mismatch: {metadata['Name']} {metadata['Version']}"
              )
          if expect_assist:
              with zipfile.ZipFile(assist[0]) as archive:
                  metadata_paths = [
                      n for n in archive.namelist() if n.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_paths) != 1:
                      raise SystemExit(
                          f"unexpected ASSIST METADATA files: {metadata_paths}"
                      )
                  assist_metadata = email.message_from_bytes(
                      archive.read(metadata_paths[0])
                  )
              from packaging.requirements import Requirement
              from packaging.version import Version

              core_requirements = [
                  requirement
                  for requirement in map(
                      Requirement, assist_metadata.get_all("Requires-Dist", [])
                  )
                  if requirement.name == "adam-core" and requirement.marker is None
              ]
              if len(core_requirements) != 1:
                  raise SystemExit(
                      "expected one unconditional adam-core requirement: "
                      f"{core_requirements}"
                  )
              if Version(expected_version) not in core_requirements[0].specifier:
                  raise SystemExit(
                      "adam-assist does not admit the candidate Core version: "
                      f"{expected_version} not in {core_requirements[0]}"
                  )
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "acceptance-report.json").read_text()
          )
          smoke_versions = report["runtime"]["smoke"]["stages"][
              "imports_and_provenance"
          ]["versions"]
          smoke_runtime_versions = report["runtime"]["smoke"]["stages"][
              "imports_and_provenance"
          ]["runtime_versions"]
          if smoke_versions["adam-core"] != expected_version:
              raise SystemExit(f"installed adam-core mismatch: {smoke_versions}")
          if smoke_runtime_versions["adam-core"] != expected_version:
              raise SystemExit(f"runtime adam-core mismatch: {smoke_runtime_versions}")
          pattern = "*${{ matrix.platform.wheel_tag }}.whl"
          invalid = [
              path.name
              for path in core + assist
              if not fnmatch.fnmatch(path.name, pattern)
          ]
          if invalid:
              raise SystemExit(f"wheel tag mismatch for {pattern}: {invalid}")
          PY

      - name: Preserve pairing patch evidence
        if: ${{ always() && matrix.python-version != '3.14' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          cp adam-assist/.cargo/config.toml \
            "$RUNNER_TEMP/acceptance/pairing-cargo-config.toml"

      - name: Upload wheel acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-acceptance-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/acceptance-report.json
            ${{ runner.temp }}/acceptance/invocation/smoke-report.json
            ${{ runner.temp }}/acceptance/wheelhouse/*.whl
            ${{ runner.temp }}/acceptance/logs/*.log
            ${{ runner.temp }}/acceptance/pairing-cargo-config.toml
          if-no-files-found: error

  extended-coverage:
    name: Slow fixtures and live service integrations
    needs: artifact-acceptance
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adam-core candidate
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
      - name: Install Core and optional test providers
        run: >-
          env -u ADAM_CORE_RELEASE_BUILD -u ADAM_CORE_BUILD_COMMIT
          pdm install -G test
      - name: Run live Rust kernel-data integrations
        run: cargo test -p adam_core_rs_kernel_data -- --ignored
      - name: Run slow scientific validation fixtures
        run: pdm run test-profile -- src/adam_core
      - name: Run live Horizons and query-client integrations
        env:
          ADAM_CORE_LIVE_HORIZONS: "1"
          ADAM_CORE_LIVE_QUERY_CLIENTS: "1"
        run: |
          pdm run test-live-integrations -- \
            src/adam_core/orbits/query/tests/test_horizons.py \
            src/adam_core/orbits/query/tests/test_query_clients_live.py
