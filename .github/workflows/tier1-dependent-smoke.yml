name: Tier-1 Exact-Ref Compatibility

# Core 0.7 intentionally lands before a compatible Assist release. Until a
# separately reviewed Assist candidate exists, this is manual-only and makes
# no scheduled or pull-request compatibility claim.
on:
  workflow_dispatch:
    inputs:
      adam_assist_ref:
        description: Exact 40-hex compatible adam-assist candidate revision
        required: true
        type: string

permissions:
  contents: read

env:
  ADAM_ASSIST_REF: ${{ inputs.adam_assist_ref }}

jobs:
  exact-ref-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adam_core
        uses: actions/checkout@v4
      - name: Set up Rust at the public-crate MSRV
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.12'
      - name: Install test and exact build dependencies
        run: pdm install -G test -G build
      - name: Build Rust wheel
        run: pdm run rust-build
      - name: Verify native wheel artifact
        run: pdm run wheel-inspect
      - name: Checkout requested dependent revision
        uses: actions/checkout@v4
        with:
          repository: B612-Asteroid-Institute/adam-assist
          ref: ${{ env.ADAM_ASSIST_REF }}
          path: dependent
          fetch-depth: 0
      - name: Verify exact dependent revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ADAM_ASSIST_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C dependent rev-parse HEAD)" = "$ADAM_ASSIST_REF"
      - name: Verify dependent declares Core 0.7 compatibility
        run: |
          python - <<'PY'
          import tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          metadata = tomllib.load(open("dependent/pyproject.toml", "rb"))["project"]
          core = [
              requirement
              for requirement in map(Requirement, metadata["dependencies"])
              if canonicalize_name(requirement.name) == "adam-core"
              and requirement.marker is None
          ]
          assert len(core) == 1, core
          assert Version("0.7.0") in core[0].specifier, core[0]
          PY
      - name: Build reference propagator in the Core test environment
        env:
          ADAM_ASSIST_RUST_REPO: ${{ github.workspace }}/dependent
        run: pdm run assist-rust-develop
      - name: Prepare compatible ASSIST lock for dependent install
        env:
          ADAM_ASSIST_RUST_REPO: ${{ github.workspace }}/dependent
        run: python migration/scripts/develop_downstream_adam_assist.py --prepare-only
      - name: Install dependent and adam_core wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            naif-de440==2020.12.21.1 \
            jpl-small-bodies-de441-n16==2021.3.31.1
          python -m pip install dist/*.whl
          # Install the exact reviewed checkout without allowing its resolver to
          # replace the candidate Core wheel. pip check below still enforces the
          # dependent's declared adam-core requirement without rewriting it.
          python -m pip install --no-deps -e dependent
          python -m pip check
      - name: Verify exact candidate installations
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import adam_core
          from adam_assist.version import __version__ as assist_version

          assert version("adam-core") == adam_core.__version__ == "0.7.0"
          assert version("adam-assist") == assist_version
          PY
      - name: Run dependent import smoke
        run: python -c "import adam_assist.propagator"
      - name: Verify Core test environment candidate installations
        run: |
          test_python="$(pdm info --python)"
          "$test_python" -m pip check
          "$test_python" - <<'PY'
          from importlib.metadata import version

          import adam_core
          from adam_assist.version import __version__ as assist_version

          assert version("adam-core") == adam_core.__version__ == "0.7.0"
          assert version("adam-assist") == assist_version
          PY
      - name: Run Core integration tests with the reference propagator
        run: |
          set -euo pipefail
          for test_path in \
            src/adam_core/propagator/tests/test_propagator.py \
            src/adam_core/propagator/tests/test_space_ephemeris.py \
            src/adam_core/dynamics/tests/test_impact_viz_data.py \
            src/adam_core/dynamics/tests/test_lambert.py \
            src/adam_core/orbit_determination/tests/test_differential_correction.py \
            src/adam_core/orbit_determination/tests/test_iod.py \
            src/adam_core/orbit_determination/tests/test_least_squares.py \
            src/adam_core/orbit_determination/tests/test_od.py \
            src/adam_core/orbits/tests/test_oem.py \
            src/adam_core/orbits/tests/test_spice_kernel.py
          do
            pdm run test -- "$test_path"
          done
      - name: Run orbit determination smoke
        run: |
          python - <<'PY'
          import numpy as np
          from adam_core.orbit_determination.gauss import calcGauss
          from adam_core.orbit_determination.gibbs import calcGibbs
          from adam_core.orbit_determination.herrick_gibbs import calcHerrickGibbs

          r1 = np.array([1.0, 0.1, -0.2], dtype=np.float64)
          r2 = np.array([0.7, -0.4, 0.3], dtype=np.float64)
          r3 = np.array([-0.6, 0.2, 0.9], dtype=np.float64)
          t1 = 59000.0
          t2 = 59001.0
          t3 = 59003.0

          gauss = np.asarray(calcGauss(r1, r2, r3, t1, t2, t3), dtype=np.float64)
          gibbs = np.asarray(calcGibbs(r1, r2, r3), dtype=np.float64)
          herrick = np.asarray(calcHerrickGibbs(r1, r2, r3, t1, t2, t3), dtype=np.float64)

          assert gauss.shape == (3,)
          assert gibbs.shape == (3,)
          assert herrick.shape == (3,)
          assert np.all(np.isfinite(gauss))
          assert np.all(np.isfinite(gibbs))
          assert np.all(np.isfinite(herrick))
          PY
