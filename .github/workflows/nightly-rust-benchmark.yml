name: Nightly Rust Benchmark

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ADAM_ASSIST_REF: 8c95fdfcaf2df68e7dc1b5c7ee540f938103bb8b

jobs:
  nightly-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get git tags
        run: git fetch --prune --unshallow --tags
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Checkout compatible adam-assist candidate
        uses: actions/checkout@v4
        with:
          repository: B612-Asteroid-Institute/adam-assist
          ref: ${{ env.ADAM_ASSIST_REF }}
          path: .ci/adam-assist
      - name: Set up PDM (cached)
        if: ${{ hashFiles('**/pdm.lock') != '' }}
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.12'
          cache: true
          cache-dependency-path: '**/pdm.lock'
      - name: Set up PDM (no cache)
        if: ${{ hashFiles('**/pdm.lock') == '' }}
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pdm install -G test
      - name: Build Rust extension
        run: pdm run rust-develop
      - name: Build compatible downstream adam-assist
        env:
          ADAM_ASSIST_RUST_REPO: ${{ github.workspace }}/.ci/adam-assist
        run: pdm run assist-rust-develop
      - name: Run full benchmarks
        run: pdm run benchmark --benchmark-json bench-nightly.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-nightly-json
          path: bench-nightly.json
